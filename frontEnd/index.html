<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Time Forum</title>
   
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <h1>Real Time Forum</h1>
        <button id="logout-btn" hidden>
          Logout
        </button>
      </header>

      <main>
        <section id="auth-view" >
          <div class="auth-card">
            <div class="auth-tabs">
              <button id="loginBtn" class="tab-btn active" >
                Login
              </button>
              <button id="registerBtn" class="tab-btn" >
                Register
              </button>
            </div>

            <div
              id="auth-message"
              class="auth-message"
              role="status"
              aria-live="polite"
            ></div>

            <form id="login-form" class="auth-form">
              <h2>Welcome back</h2>
             
                <input
                  id="login-identifier"
                  name="identifier"
                  type="text"
                  placeholder="email or nickname"
                  required
                />
             
                Password
                <input
                  id="login-password"
                  name="password"
                  type="password"
                  placeholder="password"
                  required
                />
              <button type="submit">Login</button>
            </form>

            <form id="register-form" class="auth-form" hidden>
              <h2>Create account</h2>
              <label>
                Nickname
                <input
                  id="register-nickname"
                  name="nickname"
                  type="text"
                  required
                />
              </label>
              <label>
                Age
                <input
                  id="register-age"
                  name="age"
                  type="number"
                  min="1"
                  required
                />
              </label>
              <label>
                Gender
                <select id="register-gender" name="gender" required>
                  <option value="">Select</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </label>
              <label>
                First Name
                <input
                  id="register-firstname"
                  name="firstName"
                  type="text"
                  required
                />
              </label>
              <label>
                Last Name
                <input
                  id="register-lastname"
                  name="lastName"
                  type="text"
                  required
                />
              </label>
              <label>
                Email
                <input id="register-email" name="email" type="email" required />
              </label>
              <label>
                Password
                <input
                  id="register-password"
                  name="password"
                  type="password"
                  required
                />
              </label>
              <button type="submit">Register</button>
            </form>
          </div>
        </section>

        <section id="forum-view" class="forum-view" hidden>
          <div class="forum-shell">
            <aside class="forum-sidebar">
              <h2>Forum</h2>
              <p>Posts and chat will appear here.</p>
            </aside>
            <section class="forum-content">
              <div id="posts-container">
                <p>No posts yet.</p>
              </div>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="auth/login.js"></script>
    <script src="auth/register.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
